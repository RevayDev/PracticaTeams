<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Card – Team Project</title>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL -->
  <main class="app">

    <!-- TARJETA -->
    <section class="card">

      <!-- AVATAR -->
      <div class="avatar-container">
        <img
          id="profileAvatar"
          src="https://revaydev.vercel.app/img/RevayDev.png"
          alt="Avatar del perfil"
        />
      </div>

      <!-- INFO -->
      <div class="info">
        <h2 id="profileName">RevayDev</h2>
        <p id="profileDesc">Mi primer diseño.</p>
      </div>

      <!-- BOTONES -->
      <div class="actions">
        <button id="btnMessage1" class="btn primary">
          Mensaje 1
        </button>

        <button id="btnMessage2" class="btn secondary">
          Mensaje 2
        </button>
      </div>

    </section>

  </main>

  <!-- JS -->
  <script src="script.js"></script>
</body>
</html>
